<svg xmlns="http://www.w3.org/2000/svg" width="600" height="174" viewBox="0 0 600 174" role="img" aria-label="Mobile quest menu unlocked: a floating pixel key, three colored class gems, and a pointer toward the linked quest cards." shape-rendering="crispEdges"><title>Mobile quest menu unlocked: a floating pixel key, three colored class gems, and a pointer toward the linked quest cards.</title><defs><style>@font-face{font-family:'P';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'G';src:url(data:font/woff2;base64,) format('woff2');}text{shape-rendering:auto;font-variant-ligatures:none}@keyframes key{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.key{animation:key 4s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.4}50%{opacity:1}}.spark,.gem{animation:glimmer 5s ease-in-out infinite}.g1{animation-delay:-1.5s}.g2{animation-delay:-3s}@keyframes point{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(4px)}}.arrow{animation:point 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}.frame{opacity:0!important}.frame0{opacity:1!important}}</style></defs><rect x="0" y="0" width="600" height="174" fill="#EFF3EB" /><rect x="8" y="8" width="584" height="156" fill="#FBFCF7"/><rect x="11" y="5" width="578" height="3" fill="#A4B6AD"/><rect x="11" y="164" width="578" height="3" fill="#A4B6AD"/><rect x="5" y="11" width="3" height="150" fill="#A4B6AD"/><rect x="592" y="11" width="3" height="150" fill="#A4B6AD"/><rect x="8" y="8" width="3" height="3" fill="#A4B6AD"/><rect x="589" y="8" width="3" height="3" fill="#A4B6AD"/><rect x="8" y="161" width="3" height="3" fill="#A4B6AD"/><rect x="589" y="161" width="3" height="3" fill="#A4B6AD"/><rect x="15" y="20" width="3" height="132" fill="#197F70" /><rect x="582" y="20" width="3" height="132" fill="#197F70" /><g class="key"><rect x="39" y="49" width="25" height="7" fill="#9A621E" /><rect x="32" y="56" width="7" height="25" fill="#9A621E" /><rect x="64" y="56" width="7" height="25" fill="#9A621E" /><rect x="39" y="81" width="25" height="7" fill="#9A621E" /><rect x="65" y="78" width="37" height="7" fill="#9A621E" /><rect x="83" y="85" width="7" height="14" fill="#9A621E" /><rect x="97" y="85" width="7" height="9" fill="#9A621E" /></g><text x="126" y="61" fill="#263B40" font-family="P,sans-serif" font-size="38" text-anchor="start" >QUESTS UNLOCKED</text><text x="127" y="94" fill="#526871" font-family="G,sans-serif" font-size="23" text-anchor="start" >Choose your next move.</text><rect x="126" y="109" width="417" height="1" fill="#A4B6AD" /><g class="gem g0"><rect x="126" y="129" width="6" height="6" fill="#197F70" /><rect x="128" y="127" width="2" height="10" fill="#197F70" /></g><text x="141" y="138" fill="#197F70" font-family="G,sans-serif" font-size="16" text-anchor="start" >INSPECT</text><g class="gem g1"><rect x="276" y="129" width="6" height="6" fill="#7752AE" /><rect x="278" y="127" width="2" height="10" fill="#7752AE" /></g><text x="291" y="138" fill="#7752AE" font-family="G,sans-serif" font-size="16" text-anchor="start" >PLAN</text><g class="gem g2"><rect x="397" y="129" width="6" height="6" fill="#9A621E" /><rect x="399" y="127" width="2" height="10" fill="#9A621E" /></g><text x="412" y="138" fill="#9A621E" font-family="G,sans-serif" font-size="16" text-anchor="start" >DECODE</text><g class="arrow"><rect x="541" y="124" width="4" height="4" fill="#197F70" /><rect x="545" y="128" width="4" height="4" fill="#197F70" /><rect x="549" y="124" width="4" height="4" fill="#197F70" /></g><g class="spark"><rect x="86" y="38" width="2" height="6" fill="#9A621E" /><rect x="84" y="40" width="6" height="2" fill="#9A621E" /><rect x="24" y="103" width="2" height="6" fill="#197F70" /><rect x="22" y="105" width="6" height="2" fill="#197F70" /></g></svg>
