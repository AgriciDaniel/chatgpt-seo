name: Bug or installation question
description: Report a problem with the ChatGPT SEO-pro package
title: '[Issue]: '
body:
  - type: markdown
    attributes:
      value: Do not post private exports, transcripts, credentials, or personal data. Use a short redacted example.
  - type: input
    id: version
    attributes:
      label: Plugin version and ChatGPT surface
      placeholder: SEO-pro 0.2.13, ChatGPT web
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Short redacted prompt and reproduction steps
    validations:
      required: true
